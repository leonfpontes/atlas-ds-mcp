<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)" />
    <script>
      // Theme before first paint: the system setting, or ?theme=light|dark to force one.
      ;(function () {
        var forced = new URLSearchParams(location.search).get('theme')
        var dark = forced ? forced === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <title>Demo · Atlas</title>
    <meta name="robots" content="noindex" />
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/demo.tsx"></script>
  </body>
</html>
