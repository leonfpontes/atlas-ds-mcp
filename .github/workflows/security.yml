name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Monday, 09:00 UTC
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
